[project]
name = "stellium"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "lightrag-hku[api]",
    "google-genai",
    "httpx",
    "numpy",
    "click",
    "rich",
    "python-dotenv",
    "pymupdf",
    "python-docx",
    "networkx",
    "pyyaml",
    "mcp",
    "fastapi",
    "uvicorn",
    "PySide6",
    "qasync",
    "Pillow",
    "watchdog",
    "windows-toasts;sys_platform=='win32'",
]

[project.scripts]
rag = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
