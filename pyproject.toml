[project]
name = "stellium"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "lightrag-hku[api]",
    "google-genai",
    "httpx",
    "numpy",
    "click",
    "rich",
    "python-dotenv",
    "pymupdf",
    "python-docx",
    "networkx",
    "pyyaml",
    "mcp",
    "fastapi",
    "uvicorn",
]

[project.scripts]
rag = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
